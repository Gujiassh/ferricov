name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    name: Rust ${{ matrix.toolchain }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        toolchain:
          - 1.85.0
          - stable

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install process-isolation dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends bubblewrap
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          setsid -w bwrap --unshare-pid --as-pid-1 --die-with-parent \
            --bind / / --dev-bind /dev /dev --proc /proc -- /bin/true

      - name: Install Rust toolchain
        env:
          TOOLCHAIN: ${{ matrix.toolchain }}
        run: rustup toolchain install "$TOOLCHAIN" --profile minimal --component clippy,rustfmt

      - name: Check formatting
        env:
          TOOLCHAIN: ${{ matrix.toolchain }}
        run: cargo +"$TOOLCHAIN" fmt --all --check

      - name: Check workspace
        env:
          TOOLCHAIN: ${{ matrix.toolchain }}
        run: cargo +"$TOOLCHAIN" check --workspace --all-targets --locked

      - name: Run tests
        env:
          FERRICOV_SKIP_DOCKER_E2E: '1'
          TOOLCHAIN: ${{ matrix.toolchain }}
        run: cargo +"$TOOLCHAIN" test --workspace --all-targets --locked

      - name: Run Clippy
        env:
          TOOLCHAIN: ${{ matrix.toolchain }}
        run: cargo +"$TOOLCHAIN" clippy --workspace --all-targets --locked -- -D warnings

  behavior-contract:
    name: Behavior Contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LCOV_SOURCE_ROOT: /tmp/lcov-upstream-reference

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Check out pinned LCOV source
        run: git clone --depth 1 --branch v2.5 https://github.com/linux-test-project/lcov.git "$LCOV_SOURCE_ROOT"

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.12'

      - name: Install JSON Schema validator
        run: python3 -m pip install --disable-pip-version-check jsonschema==4.25.1

      - name: Check generated behavior contract
        run: python3 compat/behavior/generate.py --check

      - name: Run behavior contract tests
        run: python3 -m unittest compat/behavior/test_validate.py

      - name: Run M0 case contract tests
        run: python3 -m unittest discover -s compat/cases -p 'test_*.py'

      - name: Run correctness baseline mutation tests
        run: python3 -m unittest discover -s compat/correctness -p 'test_*.py'

      - name: Check generated environment contract
        run: python3 compat/environment/contract.py --upstream-root "$LCOV_SOURCE_ROOT"

      - name: Run environment contract mutation tests
        run: python3 -m unittest compat/environment/test_contract.py

      - name: Validate retained tracefile corpus
        run: python3 compat/fixtures/m0-tracefiles/validate.py

      - name: Check generated tracefile contract
        run: python3 compat/tracefile/contract.py --upstream-root "$LCOV_SOURCE_ROOT"

      - name: Run tracefile contract mutation tests
        run: python3 -m unittest compat/tracefile/test_contract.py

      - name: Validate current behavior contract
        run: python3 compat/behavior/validate.py --mode current

  oracle-evidence:
    name: Oracle Evidence
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install Rust 1.85.0
        run: rustup toolchain install 1.85.0 --profile minimal --component clippy,rustfmt

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.12'

      - name: Install JSON Schema validator
        run: python3 -m pip install --disable-pip-version-check jsonschema==4.25.1

      - name: Build and verify pinned Oracle
        run: python3 compat/verify.py

      - name: Verify clean Docker execution
        run: >-
          cargo +1.85.0 test --locked -p ferricov-oracle
          differential::tests::docker_clean_environment_and_posixly_correct_change_behavior
          -- --exact

      - name: Run positive harness self-test
        run: |
          cargo +1.85.0 run --locked -p ferricov-oracle --bin differential -- \
            compat/cases/harness-self-test.json \
            compat/launchers/lcov-v2.5-oracle.json \
            compat/launchers/lcov-v2.5-oracle.json \
            /tmp/ferricov-harness-self-test

      - name: Run intentional reverse harness test
        run: |
          if cargo +1.85.0 run --locked -p ferricov-oracle --bin differential -- \
            compat/cases/harness-reverse-test.json \
            compat/launchers/lcov-v2.5-oracle.json \
            compat/launchers/different-oracle.json \
            /tmp/ferricov-harness-reverse-test; then
            echo 'Reverse harness test unexpectedly passed' >&2
            exit 1
          fi
          test "$(jq -r .overall_status \
            /tmp/ferricov-harness-reverse-test/lcov-version-must-fail/result.json)" = fail

      - name: Run harness integrity guards
        run: compat/verify-guards.sh

      - name: Validate generated evidence
        run: |
          python3 compat/verify.py --skip-oracle \
            --results /tmp/ferricov-harness-self-test \
            --results /tmp/ferricov-harness-reverse-test
