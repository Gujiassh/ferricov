name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  core-009-fuzz-smoke:
    name: CORE-009 Fuzz Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Install nightly fuzz toolchain
        run: |
          rustup toolchain install nightly --profile minimal
          cargo +nightly install cargo-fuzz --version 0.13.1 --locked
      - name: Validate permanent corpus and artifact metadata
        run: |
          python3 -m pip install --disable-pip-version-check jsonschema==4.25.1
          python3 fuzz/scripts/validate_artifacts.py
          python3 -m unittest fuzz/scripts/test_validate_artifacts.py
      - name: Replay permanent corpus with bounded libFuzzer smoke
        shell: bash
        run: |
          set -euo pipefail
          python3 fuzz/scripts/validate_artifacts.py --list-tuples |
          while IFS=$'\t' read -r target case_id seed corpus; do
            timeout --signal=KILL 60s cargo +nightly fuzz run "$target" \
              "$corpus" -- -seed="$seed" -runs=1 -timeout=2 -rss_limit_mb=512 -max_len=1048576
          done

  rust:
    name: Rust ${{ matrix.toolchain }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        toolchain:
          - 1.85.0
          - stable

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install process-isolation dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends bubblewrap
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          setsid -w bwrap --unshare-pid --as-pid-1 --die-with-parent \
            --bind / / --dev-bind /dev /dev --proc /proc -- /bin/true

      - name: Install Rust toolchain
        env:
          TOOLCHAIN: ${{ matrix.toolchain }}
        run: rustup toolchain install "$TOOLCHAIN" --profile minimal --component clippy,rustfmt

      - name: Check formatting
        env:
          TOOLCHAIN: ${{ matrix.toolchain }}
        run: cargo +"$TOOLCHAIN" fmt --all --check

      - name: Check workspace
        env:
          TOOLCHAIN: ${{ matrix.toolchain }}
        run: cargo +"$TOOLCHAIN" check --workspace --all-targets --locked

      - name: Run tests
        env:
          FERRICOV_SKIP_DOCKER_E2E: '1'
          TOOLCHAIN: ${{ matrix.toolchain }}
        run: cargo +"$TOOLCHAIN" test --workspace --all-targets --locked

      - name: Run stable CORE-009 campaign under deadline and RSS watchdog
        env:
          TOOLCHAIN: ${{ matrix.toolchain }}
        run: >-
          timeout --signal=KILL 60s bash -c
          'ulimit -v 524288; cargo +"$TOOLCHAIN" test --locked
          -p ferricov-tracefile tests_core009::deterministic_64_case_campaign_replays_all_named_targets
          -- --ignored --exact'

      - name: Qualify CORE-009 worker timeout and RSS isolation
        env:
          TOOLCHAIN: ${{ matrix.toolchain }}
        run: |
          cargo +"$TOOLCHAIN" build --locked -p ferricov-tracefile --bin core009_worker
          printf 'TN:t\nSF:x\nDA:1,1\nend_of_record\n' | timeout 2s target/debug/core009_worker normal
          if timeout 2s target/debug/core009_worker sleep; then exit 1; else status=$?; test "$status" -eq 124 -o "$status" -eq 137; fi
          if bash -c 'ulimit -v 524288; exec target/debug/core009_worker allocate 805306368'; then exit 1; fi

      - name: Run Clippy
        env:
          TOOLCHAIN: ${{ matrix.toolchain }}
        run: cargo +"$TOOLCHAIN" clippy --workspace --all-targets --locked -- -D warnings

  behavior-contract:
    name: Behavior Contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LCOV_SOURCE_ROOT: /tmp/lcov-upstream-reference

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Check out pinned LCOV source
        run: git clone --depth 1 --branch v2.5 https://github.com/linux-test-project/lcov.git "$LCOV_SOURCE_ROOT"

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.12'

      - name: Install JSON Schema validator
        run: python3 -m pip install --disable-pip-version-check jsonschema==4.25.1

      - name: Install host Perl deps for model inspector unit tests
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libcapture-tiny-perl \
            libdatetime-perl \
            libdevel-stacktrace-perl \
            libjson-pp-perl

      - name: Check generated behavior contract
        run: python3 compat/behavior/generate.py --check

      - name: Run behavior contract tests
        run: python3 -m unittest compat/behavior/test_validate.py

      - name: Run M0 case contract tests
        run: python3 -m unittest discover -s compat/cases -p 'test_*.py'

      - name: Run correctness baseline mutation tests
        run: python3 -m unittest discover -s compat/correctness -p 'test_*.py'

      - name: Check generated environment contract
        run: python3 compat/environment/contract.py --upstream-root "$LCOV_SOURCE_ROOT"

      - name: Run environment contract mutation tests
        run: python3 -m unittest compat/environment/test_contract.py

      - name: Validate retained tracefile corpus
        run: python3 compat/fixtures/m0-tracefiles/validate.py

      - name: Run tracefile semantic snapshot mutation tests
        run: python3 -m unittest compat/fixtures/m0-tracefiles/test_validate.py

      - name: Check generated tracefile contract
        run: python3 compat/tracefile/contract.py --upstream-root "$LCOV_SOURCE_ROOT"

      - name: Run tracefile contract mutation tests
        run: python3 -m unittest compat/tracefile/test_contract.py

      - name: Check generated diagnostics contract
        run: python3 compat/diagnostics/contract.py --upstream-root "$LCOV_SOURCE_ROOT"

      - name: Run diagnostics contract mutation tests
        run: python3 -m unittest compat/diagnostics/test_contract.py

      - name: Check generated installation contract
        run: python3 compat/installation/contract.py --upstream-root "$LCOV_SOURCE_ROOT"

      - name: Run installation contract mutation tests
        run: python3 -m unittest compat/installation/test_contract.py

      - name: Check generated resource contract and retained Oracle result
        run: |
          python3 compat/resources/contract.py
          python3 compat/resources/validate.py --result \
            compat/resources/results/oracle-x86_64-linux-20260729/result.json

      - name: Run resource tests
        run: >-
          python3 -m unittest
          compat/resources/test_contract.py
          compat/resources/test_exercise.py

      - name: Validate current behavior contract
        run: python3 compat/behavior/validate.py --mode current

  oracle-evidence:
    name: Oracle Evidence
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LCOV_SOURCE_ROOT: /tmp/lcov-upstream-reference

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Check out pinned LCOV source
        run: git clone --depth 1 --branch v2.5 https://github.com/linux-test-project/lcov.git "$LCOV_SOURCE_ROOT"

      - name: Install Rust 1.85.0
        run: rustup toolchain install 1.85.0 --profile minimal --component clippy,rustfmt

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.12'

      - name: Install JSON Schema validator
        run: python3 -m pip install --disable-pip-version-check jsonschema==4.25.1

      - name: Install host Perl deps for model inspector unit tests
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libcapture-tiny-perl \
            libdatetime-perl \
            libdevel-stacktrace-perl \
            libjson-pp-perl

      - name: Build and verify pinned Oracle
        run: python3 compat/verify.py

      - name: Exercise rebuilt Oracle resource capture path
        run: |
          output="$(mktemp -d)"
          trap 'rm -rf "$output"' EXIT
          python3 compat/resources/exercise.py \
            --image ferricov/lcov-oracle:v2.5 \
            --output "$output"

      - name: Verify clean Docker execution
        run: >-
          cargo +1.85.0 test --locked -p ferricov-oracle
          differential::tests::docker_clean_environment_and_posixly_correct_change_behavior
          -- --exact

      - name: Materialize rebuilt Oracle launchers for harness self-tests
        run: |
          # Historical launchers pin the original capture digest (b02cc...).
          # CI rebuilds a content-locked image with a new layer ID and tags it
          # as ferricov/lcov-oracle:v2.5. Harness integrity tests only need a
          # local runnable Oracle image, so rewrite temporary launchers to that
          # rebuilt image ID (not the historical capture digest).
          mkdir -p /tmp/ferricov-ci-launchers
          IMAGE_ID="$(docker image inspect --format '{{.Id}}' ferricov/lcov-oracle:v2.5)"
          test -n "$IMAGE_ID"
          export IMAGE_ID
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          image = os.environ["IMAGE_ID"]
          src_dir = Path("compat/launchers")
          dst_dir = Path("/tmp/ferricov-ci-launchers")
          for name in ("lcov-v2.5-oracle.json", "different-oracle.json"):
              data = json.loads((src_dir / name).read_text(encoding="utf-8"))
              data["runtime"]["image"] = image
              data["environment"]["image"] = image
              (dst_dir / name).write_text(
                  json.dumps(data, indent=2) + "\n",
                  encoding="utf-8",
              )
          print(f"HARNESS_LAUNCHERS_OK image={image}")
          PY

      - name: Run positive harness self-test
        run: |
          cargo +1.85.0 run --locked -p ferricov-oracle --bin differential -- \
            compat/cases/harness-self-test.json \
            /tmp/ferricov-ci-launchers/lcov-v2.5-oracle.json \
            /tmp/ferricov-ci-launchers/lcov-v2.5-oracle.json \
            /tmp/ferricov-harness-self-test

      - name: Run intentional reverse harness test
        run: |
          if cargo +1.85.0 run --locked -p ferricov-oracle --bin differential -- \
            compat/cases/harness-reverse-test.json \
            /tmp/ferricov-ci-launchers/lcov-v2.5-oracle.json \
            /tmp/ferricov-ci-launchers/different-oracle.json \
            /tmp/ferricov-harness-reverse-test; then
            echo 'Reverse harness test unexpectedly passed' >&2
            exit 1
          fi
          test "$(jq -r .overall_status \
            /tmp/ferricov-harness-reverse-test/lcov-version-must-fail/result.json)" = fail

      - name: Run harness integrity guards
        run: compat/verify-guards.sh

      - name: Validate generated evidence
        run: |
          python3 compat/verify.py --skip-oracle \
            --results /tmp/ferricov-harness-self-test \
            --results /tmp/ferricov-harness-reverse-test
