name: Bug report
description: Report a defect that is not an LCOV compatibility difference.
title: "bug: "
labels:
  - bug
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe what happened and why it is incorrect.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include the smallest commands or code needed to reproduce the defect.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include the Ferricov revision, OS, architecture, Rust version, and relevant external tool versions.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs or artifacts
      description: Attach non-sensitive logs, differential results, backtraces, or fixtures.
